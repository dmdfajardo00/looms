name: "Build looms-web"

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - "apps/web/Dockerfile"
      - ".github/workflows/looms-build.yml"
      - "pnpm-lock.yaml"
      - "package.json"
  workflow_dispatch:

jobs:
  build:
    name: Build looms-web (amd64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          echo "WEB_URL=http://localhost:3000" > .env
          echo "NEXT_PUBLIC_DOCKER_BUILD=true" >> .env

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase GITHUB_REPOSITORY_OWNER
        run: echo "REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER@L}" >> $GITHUB_ENV

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY_OWNER }}/looms-web:latest
            ghcr.io/${{ env.REPOSITORY_OWNER }}/looms-web:${{ github.sha }}
          cache-from: type=gha,scope=looms-amd64
          cache-to: type=gha,mode=max,scope=looms-amd64
